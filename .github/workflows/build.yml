name: Build
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name DirtyBombGamepad --icon icon.ico --add-data "icon.ico;." --collect-all sdl2dll main.py
      - uses: actions/upload-artifact@v4
        with:
          name: DirtyBombGamepad
          path: dist/DirtyBombGamepad.exe
